version: 1.0
runtime: python3
build:
  commands:
    build:
      - pip install --upgrade pip
      - pip install -r requirements.txt
run:
  command: uvicorn app.main:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
    env:
      - name: DEMO_MODE
        value: "true"
      - name: AWS_REGION
        value: "ap-southeast-2"
