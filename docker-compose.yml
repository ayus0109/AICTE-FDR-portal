version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: aicte_fdr_db
    environment:
      POSTGRES_USER: aicte_user
      POSTGRES_PASSWORD: aicte_password
      POSTGRES_DB: aicte_fdr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicte_user -d aicte_fdr"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicte_fdr_backend
    environment:
      DATABASE_URL: postgresql://aicte_user:aicte_password@db:5432/aicte_fdr
      AWS_REGION: ap-southeast-2
      USE_AWS_S3: "false"
      USE_AWS_SNS: "false"
      USE_AWS_COGNITO: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aicte_fdr_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
